  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Advertise both color schemes so the user agent paints UA-controlled
      surfaces (scrollbar tracks, form-control chrome, the document
      background BEFORE CSS loads) using the OS preference, not the
      "light by default" fallback. Pairs with the
      ``@media (prefers-color-scheme: dark)`` block in src/index.css
      so the "Writing your app…" iframe placeholder doesn't pop out as
      a white block inside dark cowork chrome (issue aether#7883).
    -->
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <title>Copilot Learning Launchpad</title>
    <script>
      (() => {
        const nativeFetch = window.fetch?.bind(window);
        if (nativeFetch) {
          window.fetch = (input, init) => {
            const url = typeof input === "string" ? input : input?.url || "";
            if (url.includes("/__dev/console")) return Promise.resolve(new Response("", { status: 204 }));
            return nativeFetch(input, init);
          };
        }
        const nativeConsoleError = console.error.bind(console);
        console.error = (...args) => {
          if (String(args[0] || "").includes("[channel] Handshake timed out")) return;
          nativeConsoleError(...args);
        };
      })();
